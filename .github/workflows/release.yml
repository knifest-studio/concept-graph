name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:pack
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sed "s/vVERSION/$RELEASE_TAG/g" .github/release-notes.md > /tmp/concept-graph-release-notes.md
          gh release create "$RELEASE_TAG" \
            --verify-tag --prerelease \
            --title "Concept Graph $RELEASE_TAG" \
            --notes-file /tmp/concept-graph-release-notes.md \
            releases/concept-graph-*.zip releases/SHA256SUMS
